# Controlled comparison with base.yaml: only model.name differs.
# Everything else is held fixed so the accuracy delta is attributable to
# the architecture alone. Do not add extra changes to this file.

seed: 42
device: cuda

data:
  root: ./data
  batch_size: 128
  num_workers: 0      # Windows: keep 0 or 2; Linux servers can use 8

model:
  name: resnet18
  num_classes: 10

train:
  epochs: 50
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  lr_milestones: [25, 40]
  lr_gamma: 0.1
  early_stop_patience: 15   # stop after this many epochs without val improvement

output:
  dir: ./outputs
