seed: 42
device: cuda

data:
  root: ./data
  batch_size: 128
  num_workers: 0      # Windows: keep 0 or 2; Linux servers can use 8

model:
  name: cnn           # start with cnn; switch to resnet18 for the comparison run
  num_classes: 10

train:
  epochs: 50
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  lr_milestones: [25, 40]
  lr_gamma: 0.1

output:
  dir: ./outputs
